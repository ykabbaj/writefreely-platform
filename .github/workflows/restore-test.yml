name: Scheduled Restore Test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  restore-test:
    name: Restore Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build WriteFreely image
        run: docker build -f docker/writefreely/Dockerfile -t writefreely-platform:${{ github.sha }} .

      - name: Run restore test
        run: make restore-test
        env:
          WRITEFREELY_IMAGE: writefreely-platform:${{ github.sha }}
